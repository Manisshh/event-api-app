version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: event_backend_app
    volumes:
      - .:/var/www/html
    ports:
      - 9000:9000
    depends_on:
      - db
    entrypoint: /bin/sh -c "chown -R www-data:www-data /var/www/html/storage && chmod -R 775 /var/www/html/storage && php-fpm"

  nginx:
    image: nginx:alpine
    container_name: event_nginx_server
    ports:
      - 8080:80
    volumes:
      - .:/var/www/html
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  db:
    image: mysql:5.7
    container_name: event_mysql_db
    restart: always
    environment:
      MYSQL_DATABASE: events
      MYSQL_ROOT_PASSWORD: Mysql@2025
    ports:
      - 3307:3306
